<!doctype html>
<html lang="id">
<head>
  <meta name="description" content="Website ulang tahun spesial untuk Lexaa.">
  <meta name="robots" content="index, follow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14070b">
  <title>HBD lexaaa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #14070b;
      --wine-soft: #1c0a10;
      --panel: #281018;
      --panel-light: #35131e;
      --strawberry: #e0245e;
      --strawberry-bright: #ff2d55;
      --milk: #ffc2d1;
      --cream: #fff2f5;
      --seed: #f4d35e;
      --leaf: #4f772d;
      --muted: #c99ba8;
      --line: rgba(255, 194, 209, .16);
      --shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--cream);
      background: var(--wine);
      font-family: "Manrope", sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
      z-index: 20;
    }
    a { color: inherit; }
    button { font: inherit; }
    :focus-visible { outline: 3px solid var(--seed); outline-offset: 4px; }

    .site-header {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 22px 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }
    .brand {
      color: var(--milk);
      font-family: "DM Serif Display", serif;
      font-size: 1.2rem;
      text-decoration: none;
    }
    .tiny-control {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 13px;
      color: var(--milk);
      background: rgba(20, 7, 11, .55);
      cursor: pointer;
      font-size: .75rem;
    }

    .hero {
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      padding: 100px 5vw 70px;
      overflow: hidden;
      background:
        radial-gradient(circle at 75% 20%, rgba(224, 36, 94, .22), transparent 28rem),
        radial-gradient(circle at 5% 90%, rgba(79, 119, 45, .13), transparent 18rem),
        var(--wine);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 26rem;
      height: 26rem;
      right: -14rem;
      bottom: -13rem;
      border: 1px solid rgba(255, 194, 209, .14);
      border-radius: 50%;
      box-shadow: 0 0 0 3rem rgba(255, 194, 209, .025), 0 0 0 8rem rgba(255, 194, 209, .018);
    }
    .hero-content { width: min(100%, 1120px); position: relative; z-index: 2; }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--seed);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1, h2, h3 {
      margin: 0;
      font-family: "DM Serif Display", serif;
      font-weight: 400;
      line-height: 1.08;
    }
    h1 {
      max-width: 760px;
      color: var(--milk);
      font-size: clamp(3.3rem, 14vw, 8.5rem);
      letter-spacing: -.04em;
    }
    .hero-subtitle {
      max-width: 510px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(.98rem, 2vw, 1.1rem);
    }
    .hero-grid {
      display: grid;
      gap: 42px;
      align-items: end;
    }
    .birthday-orbit {
      width: min(70vw, 230px);
      aspect-ratio: 1;
      position: relative;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 194, 209, .25);
      border-radius: 50%;
      background: rgba(224, 36, 94, .08);
      box-shadow: 0 0 0 16px rgba(224, 36, 94, .035), 0 0 80px rgba(224, 36, 94, .2);
      animation: reveal 1.1s ease-out both;
    }
    .strawberry-button {
      width: 116px;
      height: 130px;
      position: relative;
      border: 0;
      cursor: pointer;
      background: transparent;
      transform: rotate(45deg);
      transition: transform .3s ease;
    }
    .strawberry-button:hover { transform: rotate(45deg) scale(1.08); }
    .berry {
      position: absolute;
      inset: 12px 9px;
      border-radius: 58% 42% 60% 40%;
      background: var(--strawberry-bright);
      box-shadow: inset -13px -13px 0 rgba(150, 7, 54, .2), 8px 14px 30px rgba(0,0,0,.25);
    }
    .berry::before {
      content: "";
      position: absolute;
      width: 56px;
      height: 30px;
      left: 18px;
      top: -13px;
      background: var(--leaf);
      clip-path: polygon(50% 100%, 0 0, 38% 30%, 50% 0, 62% 30%, 100% 0);
    }
    .berry::after {
      content: "•  •  •  •  •  •  •  •";
      position: absolute;
      inset: 36px 13px;
      color: var(--seed);
      font-size: 13px;
      letter-spacing: 5px;
      line-height: 29px;
      transform: rotate(-45deg);
    }
    .orbit-note {
      position: absolute;
      bottom: -33px;
      width: 100%;
      color: var(--muted);
      font-size: .75rem;
      text-align: center;
    }
    .countdown {
      display: flex;
      gap: 12px;
      margin-top: 35px;
    }
    .time-box { min-width: 61px; }
    .time-box strong { display: block; color: var(--cream); font-size: 1.5rem; }
    .time-box span { color: var(--muted); font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; }

    .section { padding: 92px 5vw; }
    .section-inner { width: min(100%, 1000px); margin: auto; }
    .section-heading { max-width: 650px; margin-bottom: 42px; }
    .section-heading h2 { color: var(--milk); font-size: clamp(2.5rem, 7vw, 4.8rem); }
    .section-heading p { color: var(--muted); }
    .letter-section { background: var(--wine-soft); }
    .letter {
      max-width: 700px;
      padding: clamp(25px, 6vw, 58px);
      position: relative;
      border-left: 2px solid var(--strawberry);
      background: rgba(255, 194, 209, .04);
      box-shadow: var(--shadow);
    }
    .letter::before { content: "“"; position: absolute; top: -35px; left: 18px; color: var(--strawberry); font: 8rem/1 "DM Serif Display"; opacity: .7; }
    .letter p { margin: 0 0 18px; color: var(--cream); font-size: clamp(1.05rem, 2vw, 1.25rem); }
    .signature { color: var(--milk) !important; font-family: "DM Serif Display", serif; font-size: 1.4rem !important; }

    .memories { background: var(--wine); }
    .timeline { position: relative; display: grid; gap: 24px; }
    .timeline::before { content: ""; position: absolute; left: 19px; top: 15px; bottom: 15px; width: 1px; background: var(--line); }
    .memory { display: grid; grid-template-columns: 40px 1fr; gap: 20px; position: relative; }
    .memory-dot { width: 11px; height: 11px; margin: 13px 0 0 14px; z-index: 1; border-radius: 50%; background: var(--strawberry); box-shadow: 0 0 0 6px var(--wine); }
    .memory-body { display: grid; gap: 15px; padding: 0 0 30px; }
    .memory-photo {
      min-height: 165px;
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      border: 1px dashed rgba(255, 194, 209, .3);
      background: var(--panel);
      color: var(--muted);
      font-size: .8rem;
      overflow: hidden;
    }
    .memory-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .memory-photo svg { width: 80px; opacity: .7; }
    .memory-date { color: var(--seed); font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .memory h3 { color: var(--milk); font-size: 1.65rem; }
    .memory p { margin: 5px 0 0; color: var(--muted); }

    .reasons-section { background: var(--panel); }
    .reasons-layout { display: grid; gap: 34px; }
    .reason-counter { color: var(--strawberry); font-size: 4.5rem; font-weight: 800; line-height: 1; }
    .reason-counter span { color: var(--muted); font-size: 1rem; }
    .reason-card { min-height: 190px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); background: var(--wine-soft); transform: rotate(-1deg); }
    .reason-card p { margin: 0; color: var(--cream); font: clamp(1.6rem, 5vw, 2.4rem)/1.2 "DM Serif Display", serif; }
    .reason-card small { color: var(--muted); }
    .reason-actions { display: flex; gap: 10px; margin-top: 18px; }
    .button {
      border: 1px solid var(--strawberry);
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--cream);
      background: var(--strawberry);
      cursor: pointer;
      font-weight: 800;
      transition: transform .2s ease, background .2s ease;
    }
    .button:hover { background: var(--strawberry-bright); transform: translateY(-2px); }
    .button.secondary { background: transparent; color: var(--milk); border-color: var(--line); }

    .wishes-section { background: var(--wine-soft); }
    .wishes { display: grid; gap: 14px; counter-reset: wishes; }
    .wish { counter-increment: wishes; display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line); }
    .wish::before { content: "0" counter(wishes); color: var(--seed); font-size: .8rem; font-weight: 800; }
    .wish p { margin: 0; color: var(--cream); font-size: 1.03rem; }

    .closing { padding: 110px 5vw 130px; position: relative; text-align: center; background: var(--wine); overflow: hidden; }
    .closing h2 { color: var(--milk); font-size: clamp(2.8rem, 8vw, 6rem); }
    .closing p { max-width: 490px; margin: 18px auto 28px; color: var(--muted); }
    .secret { max-width: 550px; margin: 26px auto 0; padding: 22px; border: 1px solid var(--strawberry); color: var(--milk); background: rgba(224, 36, 94, .12); animation: appear .5s ease both; }
    [hidden] { display: none !important; }
    footer { padding: 20px 5vw; color: var(--muted); background: #100509; font-size: .72rem; text-align: center; }
    .petal { position: fixed; top: -20px; width: 7px; height: 10px; border-radius: 70% 30%; background: var(--strawberry); opacity: .5; pointer-events: none; z-index: 3; animation: fall linear forwards; }
    .burst { position: fixed; width: 8px; height: 8px; border-radius: 50%; background: var(--seed); pointer-events: none; z-index: 10; animation: burst .7s ease-out forwards; }

    @keyframes reveal { from { opacity: 0; transform: scale(.8) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fall { to { transform: translate3d(var(--drift), 110vh, 0) rotate(360deg); } }
    @keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }
    @media (min-width: 720px) {
      .hero-grid { grid-template-columns: 1fr 280px; }
      .birthday-orbit { margin-right: 20px; }
      .memory-body { grid-template-columns: 210px 1fr; align-items: center; gap: 28px; }
      .memory-photo { min-height: 145px; }
      .reasons-layout { grid-template-columns: 160px 1fr; align-items: start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#atas" aria-label="Kembali ke atas"></a>
    <button class="tiny-control" id="petalToggle" type="button" aria-pressed="true">Matikan kelopak</button>
  </header>

  <main id="atas">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <div class="hero-grid">
          <div>
            <p class="eyebrow" id="heroEyebrow"></p>
            <h1 id="hero-title"></h1>
            <p class="hero-subtitle" id="heroSubtitle"></p>
            <div class="countdown" id="countdown" aria-live="polite"></div>
          </div>
          <div class="birthday-orbit">
            <button class="strawberry-button" id="strawberryButton" type="button" aria-label="Klik stroberi untuk menyalakan kejutan">
              <span class="berry" aria-hidden="true"></span>
            </button>
            <p class="orbit-note" id="orbitNote">sentuh aku pelan-pelan</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section letter-section" aria-labelledby="letter-title">
      <div class="section-inner">
        <div class="section-heading">
          <p class="eyebrow">01 · Pesan utama</p>
          <h2 id="letter-title"></h2>
        </div>
        <div class="letter">
          <p id="letterMessage"></p>
          <p class="signature" id="letterSignature"></p>
        </div>
      </div>
    </section>

    <section class="section memories" aria-labelledby="memory-title">
      <div class="section-inner">
        <div class="section-heading">
          <p class="eyebrow">02 · Potongan waktu</p>
          <h2 id="memory-title"></h2>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <section class="section reasons-section" aria-labelledby="reason-title">
      <div class="section-inner reasons-layout">
        <div>
          <p class="eyebrow">03 · Alasan</p>
          <div class="reason-counter"><span id="reasonNumber">01</span><span> / 03</span></div>
        </div>
        <div>
          <h2 id="reason-title"></h2>
          <div class="reason-card" aria-live="polite">
            <p id="reasonText"></p>
            <small id="reasonLabel"></small>
          </div>
          <div class="reason-actions">
            <button class="button" id="nextReason" type="button">Lihat alasan berikutnya</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section wishes-section" aria-labelledby="wish-title">
      <div class="section-inner">
        <div class="section-heading">
          <p class="eyebrow">04 · Harapan</p>
          <h2 id="wish-title"></h2>
        </div>
        <div class="wishes" id="wishes"></div>
      </div>
    </section>

    <section class="closing" aria-labelledby="closing-title">
      <p class="eyebrow">05 · Paling akhir</p>
      <h2 id="closing-title"></h2>
      <p id="closingText"></p>
      <button class="button" id="surpriseButton" type="button"></button>
      <div class="secret" id="secret" hidden></div>
    </section>
  </main>
  <footer>Dibuat dengan harapan kamu suka sayang.</footer>

<meta name="robots" content="index, follow"><meta name="description" content="Website ulang tahun spesial untuk Lexaa.">
<meta name="robots" content="index, follow">
  <script>
    const config = {
      name: "Heksa anugrah arisanti",
      shortName: "Lexaa",
      age: 22,
      birthday: "2027-01-29T00:00:00+07:00",
      hero: {
        eyebrow: "Surat kecil dari boyfie",
        subtitle: "Untuk perempuan favoritku yang hari ini genap 22 tahun."
      },
      letter: {
        title: "Untuk kamu, yang selalu terasa seperti rumah.",
        message: "HBD sayang. Terima kasih sudah hadir dengan cara paling indah dan membuat hari-hariku terasa lebih berwarna. Aku bangga melihatmu tumbuh menjadi perempuan yang imut, lucu, dan cantik. Semoga di umur 22 ini, semua hal baik mulai berdatangan kepadamu.",
        signature: "boyfie ♡"
      },
      sectionTitles: {
        memories: "Banyak hal yang ga bisa aku ungkapin dengan kata kata.",
        reasons: "Tiga hal yang aku suka dari kamu.",
        wishes: "I hope.",
        closing: "Masih ada satu hal."
      },
      memories: [
        { date: "Momen pertama", title: "Awal yang ga terduga", text: "Dari obrolan kecil yang ternyata menjadi awal dari banyak cerita besar.", photo: "memory-01.jpeg", alt: "Potret Heksa tersenyum di luar ruangan." },
        { date: "Hari-hari kita", title: "Tawa di sela rutinitas", text: "Bersamamu, hal biasa pun selalu terasa asik.", photo: "memory-02.jpeg", alt: "Potret Heksa dalam suasana redup." },
        { date: "Hal sedih", title: "Problem", text: "Walaupun sering ribut tapi tanpa kita sadari udah sejauh ini.", photo: "memory-03.jpeg", alt: "Potret Heksa memakai kacamata dan kalung." },
        { date: "Hari ini", title: "Ultahmu", text: "Kedepannya aku hanya ingin hal hal baik yang menantimu.", photo: "memory-04.jpeg", alt: "Heksa duduk di luar ruangan dengan pakaian merah." }
      ],
      reasons: [
        "Cara kamu peduli, bahkan pada hal-hal kecil yang sering tidak terlihat.",
        "Senyum manismu yang selalu berhasil mengubah hari buruk menjadi lebih ringan.",
        "Parasmu yang mempesona selalu menjadi pusat perhatianku."
      ],
      wishes: [
        "Semoga harimu selalu berjalan dengan baik.",
        "Semoga mimpi-mimpi yang kamu inginkan terwujud.",
        "Semoga kita terus betahan sampai ajal menjemput."
      ],
      closing: {
        text: "Kalau sudah siap, ada sedikit kejutan kecil sayang",
        button: "Buka kejutan",
        secret: "Kalau dunia terasa terlalu ramai, jadikan aku tempatmu bersandar untuk beristirahat, lovee u sayanggg ♡"
      },
      musicFile: "nama-file.mp3" // Opsional: siapkan file lokal jika ingin menambahkan musik.
    };

    const $ = (selector) => document.querySelector(selector);
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.title = `Selamat ulang tahun, ${config.shortName}`;
    $("#heroEyebrow").textContent = config.hero.eyebrow;
    $("#hero-title").innerHTML = `Selamat ulang tahun,<br><em>${config.shortName}.</em>`;
    $("#heroSubtitle").textContent = config.hero.subtitle;
    $("#letter-title").textContent = config.letter.title;
    $("#letterMessage").textContent = config.letter.message;
    $("#letterSignature").textContent = config.letter.signature;
    $("#memory-title").textContent = config.sectionTitles.memories;
    $("#reason-title").textContent = config.sectionTitles.reasons;
    $("#wish-title").textContent = config.sectionTitles.wishes;
    $("#closing-title").textContent = config.sectionTitles.closing;
    $("#closingText").textContent = config.closing.text;
    $("#surpriseButton").textContent = config.closing.button;

    function strawberrySvg() {
      return `<svg viewBox="0 0 100 100" role="img" aria-label="Ilustrasi stroberi"><path fill="#E0245E" d="M50 88C28 88 17 70 20 48c2-17 15-26 30-20 15-6 28 3 30 20 3 22-8 40-30 40Z"/><path fill="#4F772D" d="M50 31 30 15l18 6L50 5l5 16 18-6-20 16Z"/><g fill="#F4D35E"><circle cx="37" cy="43" r="2"/><circle cx="51" cy="41" r="2"/><circle cx="64" cy="47" r="2"/><circle cx="42" cy="57" r="2"/><circle cx="57" cy="58" r="2"/><circle cx="50" cy="73" r="2"/></g></svg>`;
    }

    $("#timeline").innerHTML = config.memories.map((memory) => `
      <article class="memory">
        <div class="memory-dot" aria-hidden="true"></div>
        <div class="memory-body">
          <div class="memory-photo"><img src="${memory.photo}" alt="${memory.alt}" loading="lazy"></div>
          <div><span class="memory-date">${memory.date}</span><h3>${memory.title}</h3><p>${memory.text}</p></div>
        </div>
      </article>
    `).join("");
    $("#wishes").innerHTML = config.wishes.map((wish) => `<div class="wish"><p>${wish}</p></div>`).join("");

    let reasonIndex = 0;
    function showReason() {
      $("#reasonNumber").textContent = String(reasonIndex + 1).padStart(2, "0");
      $("#reasonText").textContent = config.reasons[reasonIndex];
      $("#reasonLabel").textContent = `alasan ${reasonIndex + 1} dari ${config.reasons.length}`;
    }
    showReason();
    $("#nextReason").addEventListener("click", () => {
      reasonIndex = (reasonIndex + 1) % config.reasons.length;
      showReason();
    });

    const birthday = new Date(config.birthday);
    function updateCountdown() {
      const now = new Date();
      const difference = birthday - now;
      if (difference <= 0 && now.toDateString() === birthday.toDateString()) {
        $("#countdown").innerHTML = `<strong>Hari ini hari kamu ♡</strong>`;
        return;
      }
      const days = Math.max(0, Math.floor(difference / 86400000));
      const hours = Math.max(0, Math.floor(difference / 3600000) % 24);
      const minutes = Math.max(0, Math.floor(difference / 60000) % 60);
      $("#countdown").innerHTML = [["hari", days], ["jam", hours], ["menit", minutes]]
        .map(([label, value]) => `<div class="time-box"><strong>${value}</strong><span>${label}</span></div>`).join("");
    }
    updateCountdown();
    setInterval(updateCountdown, 60000);

    function burstAt(x, y) {
      if (reduceMotion) return;
      for (let i = 0; i < 16; i += 1) {
        const particle = document.createElement("i");
        particle.className = "burst";
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.setProperty("--x", `${Math.cos(i * Math.PI / 8) * (45 + Math.random() * 45)}px`);
        particle.style.setProperty("--y", `${Math.sin(i * Math.PI / 8) * (45 + Math.random() * 45)}px`);
        document.body.appendChild(particle);
        particle.addEventListener("animationend", () => particle.remove());
      }
    }
    $("#strawberryButton").addEventListener("click", (event) => {
      burstAt(event.clientX, event.clientY);
      $("#orbitNote").textContent = "kejutan kecil untuk kamu ♡";
    });

    let petalsOn = true;
    let petalTimer;
    function dropPetal() {
      if (!petalsOn || reduceMotion) return;
      const petal = document.createElement("i");
      petal.className = "petal";
      petal.style.left = `${Math.random() * 100}vw`;
      petal.style.setProperty("--drift", `${(Math.random() - .5) * 180}px`);
      petal.style.animationDuration = `${7 + Math.random() * 6}s`;
      document.body.appendChild(petal);
      petal.addEventListener("animationend", () => petal.remove());
    }
    petalTimer = setInterval(dropPetal, 900);
    $("#petalToggle").addEventListener("click", (event) => {
      petalsOn = !petalsOn;
      event.currentTarget.textContent = petalsOn ? "Matikan kelopak" : "Nyalakan kelopak";
      event.currentTarget.setAttribute("aria-pressed", String(petalsOn));
      if (!petalsOn) document.querySelectorAll(".petal").forEach((petal) => petal.remove());
    });

    $("#surpriseButton").addEventListener("click", (event) => {
      $("#secret").textContent = config.closing.secret;
      $("#secret").hidden = false;
      event.currentTarget.textContent = "Kejutan terbuka ♡";
      event.currentTarget.disabled = true;
      burstAt(window.innerWidth / 2, event.clientY);
    });
  </script>
</body>
</html>
